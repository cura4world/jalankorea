# 안드로이드 빌드 (플레이 스토어 제출용 AAB + 폰 설치용 APK)
# 수동 실행 또는 v로 시작하는 태그를 밀면 동작한다.
# 콘텐츠가 앱 안에 내장되므로 오프라인에서 작동한다.
name: Build Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # 앱 내장용 빌드. base가 상대경로여야 WebView가 자산을 찾는다.
      - name: Build web assets
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Sync Capacitor
        run: npx cap sync android

      # 재설치 시 "앱이 설치되지 않음" 오류를 막으려면 versionCode가 매번 증가해야 한다.
      - name: Set version code
        run: echo "ORG_GRADLE_PROJECT_versionCode=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build AAB and APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/jalankorea.aab
          cp android/app/build/outputs/apk/release/app-release.apk out/jalankorea.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: out/

      # 태그를 밀었을 때만 릴리스를 만든다.
      # 설치 주소가 항상 같으므로 재설치 링크를 다시 찾을 필요가 없다:
      # https://github.com/<사용자>/<저장소>/releases/latest/download/jalankorea.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/jalankorea.aab
            out/jalankorea.apk
